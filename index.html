<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ececec">
    <meta name="description" content="Blankets for Bunnies event links.">
    <title>Blankets for Bunnies</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="event-page">
      <header class="event-header">
        <img class="portrait" src="./assets/bunny.png" width="111" height="111" alt="A fluffy bunny peeking up at the camera">
        <h1>BLANKETS FOR BUNNIES</h1>
        <p class="subtitle">subtitle for the event</p>
      </header>

      <p id="pending-links" class="visually-hidden">This link is not available yet. Its content or destination is awaiting confirmation.</p>
      <nav class="event-links" aria-label="Event links">
        <!-- Add confirmed href values and remove role, tabindex, aria-disabled,
             aria-describedby, and title when each destination is supplied. -->
        <a class="event-link about" role="link" tabindex="0" aria-disabled="true" aria-describedby="pending-links" title="Link not available yet">
          <span>About Event</span>
          <img class="doodle calendar" src="./assets/calendar.svg" alt="">
        </a>
        <a class="event-link haven" href="https://www.rabbithaven.org/">
          <img class="doodle pointer" src="./assets/pointer.svg" alt="">
          <span>Rabbit Haven.org</span>
        </a>
        <a class="event-link volunteer" href="https://microsoft.benevity.org/volunteer/external/track/?cause_id=840-912032325">
          <span>Submit volunteer time</span>
          <img class="doodle stopwatch" src="./assets/stopwatch.svg" alt="">
        </a>
        <a class="event-link donate" href="https://microsoft.benevity.org/wpgdonate/1/840-912032325">
          <img class="doodle donation" src="./assets/donation.svg" alt="">
          <span>Make a donation</span>
        </a>
        <a class="event-link sponsor" href="https://www.patreon.com/rabbithaven">
          <span>Be a monthly bunny sponsor<img class="doodle sponsor-bunny" src="./assets/sponsor-bunny.svg" alt=""></span>
        </a>
      </nav>

      <footer>
        <nav class="social-links" aria-label="Social and giving links" aria-describedby="pending-links">
          <a class="social-link facebook" role="link" tabindex="0" aria-label="Facebook" aria-disabled="true" aria-describedby="pending-links" title="Facebook link not available yet">
            <img src="./assets/facebook.svg" alt="">
          </a>
          <a class="social-link instagram" role="link" tabindex="0" aria-label="Instagram" aria-disabled="true" aria-describedby="pending-links" title="Instagram link not available yet">
            <img src="./assets/instagram.svg" alt="">
          </a>
          <a class="social-link give" role="link" tabindex="0" aria-label="Give" aria-disabled="true" aria-describedby="pending-links" title="Give link not available yet">
            <img src="./assets/give.svg" alt="">
          </a>
        </nav>
      </footer>
    </main>
  </body>
</html>
